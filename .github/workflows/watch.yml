name: Watch Form 4 (casi tiempo real)

on:
  schedule:
    # cada 5 min -- el piso que permite GitHub Actions. El loop de adentro
    # de watch.py es lo que da la latencia real (poll cada 20s); esto solo
    # asegura que, si el loop anterior murio o esta por llegar a su limite
    # de duracion, el siguiente arranca sin un hueco largo. concurrency
    # evita que corran dos loops a la vez.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: edgar-form4-live-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # backstop -- watch.py se cierra solo a los 340 min
    steps:
      - uses: actions/checkout@v4
        with:
          # FIX 2026-09-21 (causa raiz de los "huecos" de deteccion): por defecto checkout@v4 usa el SHA con el que se
          # CREO la corrida programada. Como una corrida espera en cola (concurrency) hasta que termina la anterior
          # (340 min), main ya avanzo y el checkout dejaba el repo en un commit VIEJO: todos los `git push` eran
          # non-fast-forward durante 5,7 h (la corrida detectaba pero no publicaba) y las corridas alternaban
          # 340 min sana / 340 min muda. Con `ref: main` el checkout es SIEMPRE el ultimo main.
          ref: main
          fetch-depth: 0  # historial completo, no shallow

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - run: |
          git config user.name "edgar-form4-live bot"
          git config user.email "actions@users.noreply.github.com"

      - run: python -u watch.py
